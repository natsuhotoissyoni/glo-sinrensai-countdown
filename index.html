<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>新連載 公開までのカウントダウン</title>
<style>
  :root {
    --ink: #2b2427;
    --sub: #6a6065;
    --accent: #b8446a;
    --accent-dark: #9e3758;
    --line: #e8dfe3;
    --bg: #ffffff;
    --box: #fbf8f9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
  }
  .card {
    max-width: 680px;
    margin: 0 auto;
    padding: 22px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--box);
    text-align: center;
  }
  .label {
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: bold;
    color: var(--accent);
    letter-spacing: 0.08em;
  }
  .headline {
    margin: 0 0 16px;
    font-size: 20px;
    font-weight: bold;
    line-height: 1.5;
  }
  .timer {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 0 0 16px;
  }
  .unit {
    min-width: 64px;
    padding: 10px 4px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .num {
    display: block;
    font-size: 28px;
    font-weight: bold;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .cap {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    color: var(--sub);
  }
  .note {
    margin: 0;
    font-size: 14px;
    line-height: 1.7;
    color: var(--sub);
  }
  .btn {
    display: inline-block;
    margin-top: 4px;
    padding: 14px 32px;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    font-weight: bold;
    text-decoration: none;
    border-radius: 30px;
  }
  .btn:hover { background: var(--accent-dark); }
  .error {
    margin: 0;
    font-size: 14px;
    line-height: 1.7;
    color: #a33;
  }
  [hidden] { display: none !important; }
  @media (max-width: 360px) {
    .unit { min-width: 56px; }
    .num { font-size: 24px; }
    .headline { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="card">

  <!-- 公開前 -->
  <div id="before" hidden>
    <p class="label">まもなく公開</p>
    <p class="headline" id="date-text"></p>
    <div class="timer">
      <div class="unit"><span class="num" id="d">0</span><span class="cap">日</span></div>
      <div class="unit"><span class="num" id="h">00</span><span class="cap">時間</span></div>
      <div class="unit"><span class="num" id="m">00</span><span class="cap">分</span></div>
      <div class="unit"><span class="num" id="s">00</span><span class="cap">秒</span></div>
    </div>
    <p class="note">このページをブックマークしてお待ちください。<br>公開時刻になると、ここに第1回へのボタンが表示されます。</p>
  </div>

  <!-- 公開後 -->
  <div id="after" hidden>
    <p class="label">公開中</p>
    <p class="headline">第1回が公開されました</p>
    <a class="btn" id="read-link" href="#" target="_top">第1回記事を読む</a>
  </div>

  <!-- 設定ミス -->
  <div id="error" hidden>
    <p class="error">表示の設定に誤りがあります。<br>iframeのURLの at（公開日時12桁）と id（記事番号）を確認してください。</p>
  </div>

</div>

<script>
(function () {
  var ARTICLE_BASE = 'https://renaissance-media.jp/articles/-/';

  var params = new URLSearchParams(location.search);
  var at = (params.get('at') || '').trim();
  var id = (params.get('id') || '').trim();
  var preview = params.get('preview'); // 確認用：before / after

  var elBefore = document.getElementById('before');
  var elAfter = document.getElementById('after');
  var elError = document.getElementById('error');

  function showOnly(el) {
    elBefore.hidden = el !== elBefore;
    elAfter.hidden = el !== elAfter;
    elError.hidden = el !== elError;
  }

  // 入力チェック（at は日本時間の年月日時分12桁、id は数字）
  var m = /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})$/.exec(at);
  if (!m || !/^\d+$/.test(id)) { showOnly(elError); return; }

  var y = +m[1], mo = +m[2], d = +m[3], h = +m[4], mi = +m[5];
  if (h > 23 || mi > 59) { showOnly(elError); return; }

  // 日本時間 → 世界標準時のミリ秒
  var target = Date.UTC(y, mo - 1, d, h - 9, mi);
  var jst = new Date(target + 9 * 3600000);
  if (jst.getUTCFullYear() !== y || jst.getUTCMonth() !== mo - 1 || jst.getUTCDate() !== d) {
    showOnly(elError); return;
  }

  var week = '日月火水木金土'.charAt(jst.getUTCDay());
  document.getElementById('date-text').textContent =
    mo + '月' + d + '日（' + week + '）' + h + '時' + (mi ? mi + '分' : '') + 'に公開されます';
  document.getElementById('read-link').href = ARTICLE_BASE + id;

  // サーバー時刻との差（端末の時計がずれていても正しく判定するため）
  var offset = 0;
  function now() { return Date.now() + offset; }

  function sync() {
    var start = Date.now();
    return fetch(location.pathname + '?sync=' + start, { method: 'HEAD', cache: 'no-store' })
      .then(function (res) {
        var end = Date.now();
        var server = Date.parse(res.headers.get('Date') || '');
        if (!isNaN(server)) {
          // Date ヘッダーは秒単位なので平均 0.5 秒を足し、通信時間の半分を補正
          offset = server + 500 + (end - start) / 2 - end;
        }
      })
      .catch(function () { /* 取得できなければ端末の時計を使う */ });
  }

  var elD = document.getElementById('d');
  var elH = document.getElementById('h');
  var elM = document.getElementById('m');
  var elS = document.getElementById('s');
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  var timer = null;
  function tick() {
    var diff = target - now();
    if (preview === 'after') diff = -1;
    if (preview === 'before' && diff <= 0) diff = 0.5;

    if (diff <= 0) {
      showOnly(elAfter);
      if (timer) { clearInterval(timer); timer = null; }
      return;
    }
    var sec = Math.floor(diff / 1000);
    elD.textContent = Math.floor(sec / 86400);
    elH.textContent = pad(Math.floor(sec % 86400 / 3600));
    elM.textContent = pad(Math.floor(sec % 3600 / 60));
    elS.textContent = pad(sec % 60);
    showOnly(elBefore);
  }

  function start() {
    tick();
    if (!timer && elAfter.hidden) timer = setInterval(tick, 250);
  }

  // サーバー時刻の取得を最大2秒待ってから表示を始める（表示のちらつき防止）
  var started = false;
  function startOnce() { if (!started) { started = true; start(); } }
  sync().then(startOnce);
  setTimeout(startOnce, 2000);

  // タブに戻ってきたときに時刻を取り直す
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') sync().then(tick);
  });
})();
</script>
</body>
</html>
